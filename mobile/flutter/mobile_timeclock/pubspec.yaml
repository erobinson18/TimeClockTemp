name: mobile_timeclock
description: TimeClock Mobile (v5.0.0)
publish_to: "none"

version: 5.0.0+5

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Web launcher
  url_launcher: ^6.3.0

  # Authentication
  flutter_appauth: ^8.0.3

  # Networking
  http: ^1.2.2
  xml: ^6.5.0
  connectivity_plus: ^6.0.5

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Needed by secure_hive.dart + punch_integrity.dart
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.3

  # GPS
  geolocator: ^11.0.0

  cupertino_icons: ^1.0.8

  path_provider: ^2.1.5
  share_plus: ^10.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  ios: true
  image_path: assets/images/tsg_app_icon.png

flutter:
  uses-material-design: true

  assets:
    - assets/images/the_systems_group_logo.png
    - assets/certs/tsg_cert.pem
    - assets/images/tsg_industrial_bg.png
    - assets/images/tsg_app_icon.png