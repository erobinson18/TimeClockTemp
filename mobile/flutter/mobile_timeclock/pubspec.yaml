name: mobile_timeclock
description: TimeClock Mobile (v4.0.1)
publish_to: "none"

version: 4.0.1+401

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Networking
  http: ^1.2.2
  xml: ^6.5.0
  connectivity_plus: ^6.0.5

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Needed by secure_hive.dart + punch_integrity.dart
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.3

  # GPS
  geolocator: ^11.0.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/the_systems_group_logo.png
    - assets/certs/tsg_cert.pem